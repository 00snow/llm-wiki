<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{SUBTITLE}}：由 LLM Wiki 自動產生的教學簡報">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<!-- 由 slides/pipeline/build_slides.py 產生，請改 outline.json 或 template.html，不要直接改這個檔 -->
<style>
:root {
  --bg: #faf6f1; --surface: #ffffff; --sidebar: #f5efe8; --text: #3d3833; --muted: #9b928a;
  --line: #ece4db; --rose: #c97b7b; --rose-soft: #f8e6e3; --rose-tint: #fdf3f1;
  --sage: #7f9a7a; --sage-soft: #e7eee3; --butter: #fbf0cf; --butter-text: #8a6d1f;
  --code-bg: #f6f0ea; --shadow: 0 2px 6px rgba(120,90,70,.05), 0 12px 32px rgba(120,90,70,.06);
  --font: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-en: "Quicksand", "Noto Sans TC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1c1a; --surface: #282422; --sidebar: #1b1917; --text: #ece5de; --muted: #a0968d;
    --line: #3a3430; --rose: #e6a3a0; --rose-soft: #43302e; --rose-tint: #2f2725;
    --sage: #a9c2a3; --sage-soft: #2e3a2c; --butter: #3d3523; --butter-text: #e8cf8a;
    --code-bg: #2f2a27; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1c1a; --surface: #282422; --sidebar: #1b1917; --text: #ece5de; --muted: #a0968d;
  --line: #3a3430; --rose: #e6a3a0; --rose-soft: #43302e; --rose-tint: #2f2725;
  --sage: #a9c2a3; --sage-soft: #2e3a2c; --butter: #3d3523; --butter-text: #e8cf8a;
  --code-bg: #2f2a27; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-weight: 400; letter-spacing: .02em; overflow: hidden; }
a { color: var(--rose); }

/* ---------- 舞台：1280×720 固定設計，等比縮放 ---------- */
.deck { position: fixed; left: 50%; top: 50%; width: 1280px; height: 720px;
  transform: translate(-50%, -50%) scale(var(--scale, 1)); }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .25s ease; }
.slide.active { opacity: 1; visibility: visible; }
.frame { position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: 44px 64px 26px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 28px; box-shadow: var(--shadow); }
.eyebrow { margin: 0 0 6px; font-family: var(--font-en); font-weight: 700; font-size: 15px;
  letter-spacing: .22em; color: var(--rose); text-transform: uppercase; }
.body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
footer { display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.src { padding: 3px 12px; border-radius: 999px; background: var(--sage-soft); color: var(--sage);
  text-decoration: none; font-weight: 500; font-size: 13px; }
.src:hover { outline: 1px solid var(--sage); }
.pg { font-family: var(--font-en); font-weight: 700; letter-spacing: .12em; white-space: nowrap; }

h1, h2 { font-weight: 700; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h2 { font-size: 42px; line-height: 1.3; margin-bottom: 14px; }
.lead { font-size: 24px; color: var(--muted); margin: 0 0 22px; line-height: 1.6; }
code { font-family: var(--font-mono); font-size: .92em; background: var(--code-bg);
  padding: 2px 10px; border-radius: 8px; white-space: nowrap; }

/* 封面 */
.layout-title .frame { background: linear-gradient(135deg, var(--rose-tint), var(--butter) 150%); border-color: var(--rose-soft); }
.cover { margin: auto 0; }
.kicker { font-family: var(--font-en); font-weight: 700; letter-spacing: .3em; color: var(--rose); font-size: 18px; margin: 0 0 22px; }
.cover h1 { font-size: 76px; line-height: 1.2; }
.subtitle { font-size: 30px; margin: 22px 0 46px; font-weight: 300; }
.hint { font-size: 16px; color: var(--muted); margin: 0; }

/* 路線圖 */
.road { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 10px; }
.stop { display: flex; flex-direction: column; gap: 6px; padding: 20px 22px; border-radius: 20px;
  background: var(--bg); border: 1px solid var(--line); text-decoration: none; color: var(--text);
  transition: transform .15s, border-color .15s; }
.stop:hover { transform: translateY(-3px); border-color: var(--rose); }
.stop b { font-family: var(--font-en); color: var(--rose); font-size: 18px; letter-spacing: .1em; }
.stop span { font-size: 26px; font-weight: 700; }
.stop small { font-size: 17px; color: var(--muted); line-height: 1.5; }

/* 比喻對照 */
.pairs { display: grid; gap: 12px; }
.pair { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: center; }
.pair.head div { font-family: var(--font-en); font-weight: 700; font-size: 15px; letter-spacing: .2em; color: var(--muted); padding: 0 24px; }
.pair .life, .pair .ai { padding: 16px 24px; border-radius: 18px; font-size: 25px; line-height: 1.45; }
.pair .life { background: var(--butter); color: var(--text); }
.pair .ai { background: var(--rose-tint); border: 1px solid var(--rose-soft); font-weight: 500; }
.arrow { text-align: center; color: var(--rose); font-size: 28px; }

/* 一層包一層 */
.nest { display: flex; margin-top: 12px; }
.ring { flex: 1; display: flex; flex-direction: column; padding: 14px 22px 18px; border-radius: 26px;
  border: 1.5px solid var(--rose-soft); background: var(--rose-tint); }
.ring .ring { background: var(--surface); }
.ring .ring .ring { background: var(--sage-soft); border-color: var(--sage); }
.ring .ring .ring .ring { background: var(--butter); border-color: var(--butter-text); }
.ring-label { display: flex; align-items: baseline; gap: 18px; }
.ring-label b { font-size: 28px; }
.ring + .ring, .ring .ring { margin-top: 14px; }
.ring-label small { font-size: 19px; color: var(--muted); }

/* 測驗 */
.question { font-size: 30px; margin: 4px 0 24px; font-weight: 500; line-height: 1.5; }
.opts { display: grid; gap: 14px; }
.opt { display: flex; gap: 18px; align-items: center; text-align: left; font: inherit; font-size: 25px;
  padding: 16px 24px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--bg);
  color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--rose); }
.opt b { font-family: var(--font-en); color: var(--rose); width: 1.2em; }
.opt.right { background: var(--sage-soft); border-color: var(--sage); }
.opt.wrong { background: var(--rose-tint); border-color: var(--rose); opacity: .75; }
.explain { font-size: 22px; line-height: 1.6; margin: 20px 0 0; padding: 14px 22px; border-radius: 16px;
  background: var(--sage-soft); visibility: hidden; }
.answered .explain { visibility: visible; }

/* 動手算 */
.calc { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.35fr; gap: 28px; align-items: center; }
.calc.solo { grid-template-columns: 1fr; align-items: start; }
.solo .steps li { font-size: 25px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: 12px; }
.steps li { counter-increment: st; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
  font-size: 21px; line-height: 1.55; padding-left: 44px; position: relative; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 1px; width: 30px; height: 30px;
  border-radius: 50%; background: var(--rose-soft); color: var(--rose); font-family: var(--font-en);
  font-weight: 700; font-size: 16px; display: grid; place-items: center; }
.steps .lbl { color: var(--muted); }
.takeaway { margin: 16px 0 0; padding: 14px 22px; border-radius: 16px; background: var(--sage-soft);
  font-size: 21px; font-weight: 500; }
.takeaway::before { content: "✓  "; color: var(--sage); }

/* 講解圖（沿用 wiki 的 d- class） */
.diagram { margin: 0; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px;
  min-height: 0; max-height: 100%; display: flex; align-items: center; justify-content: center; }
.diagram svg { display: block; width: 100%; height: auto; max-height: 400px; }
.diagram figcaption { color: var(--muted); font-size: 14px; margin-top: 8px; text-align: center; }
.diagram text { font-family: var(--font); font-size: 14px; letter-spacing: 0; fill: var(--text); }
.diagram .d-sub { font-size: 12px; fill: var(--muted); }
.diagram .d-b { font-weight: 700; }
.diagram .d-t-rose { fill: var(--rose); }
.diagram .d-t-sage { fill: var(--sage); }
.diagram .d-t-inv { fill: var(--surface); }
.diagram .d-box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.diagram .d-gray { fill: var(--sidebar); stroke: var(--line); stroke-width: 1; }
.diagram .d-rose { fill: var(--rose-tint); stroke: var(--rose); stroke-width: 1; }
.diagram .d-sage { fill: var(--sage-soft); stroke: var(--sage); stroke-width: 1; }
.diagram .d-butter { fill: var(--butter); stroke: var(--butter-text); stroke-width: 1; }
.diagram .d-ink { fill: var(--text); stroke: var(--line); stroke-width: 1; }
.diagram .d-dot-rose { fill: var(--rose); }
.diagram .d-dot-sage { fill: var(--sage); }
.diagram .d-line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.diagram .d-line-rose { fill: none; stroke: var(--rose); stroke-width: 2; }
.diagram .d-line-sage { fill: none; stroke: var(--sage); stroke-width: 2; }
.diagram .d-dash { stroke-dasharray: 6 5; }
.diagram .d-win { fill: none; stroke: var(--rose); stroke-width: 3; }
.diagram .d-head { fill: var(--muted); }
.diagram .d-head-rose { fill: var(--rose); }
.diagram .d-head-sage { fill: var(--sage); }

/* 條列 */
.blist { flex: 1; min-height: 0; }
.blist.with-fig { display: grid; grid-template-columns: 1fr 1.1fr; gap: 30px; align-items: center; }
.blist ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
.blist li { font-size: 25px; line-height: 1.5; padding-left: 30px; position: relative; }
.blist li::before { content: ""; position: absolute; left: 4px; top: .6em; width: 10px; height: 10px; border-radius: 50%; background: var(--rose); }
.with-fig li { font-size: 21px; }
.blist.fig-wide { grid-template-columns: 1fr 2.3fr; gap: 24px; }
.fig-wide li { font-size: 19px; }
.fig-wide .diagram svg { max-height: 440px; }
.fig-wide .diagram text { font-size: 13px; }

/* 表格 */
table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; font-size: 23px; }
th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--line); line-height: 1.45; }
tr:last-child td { border-bottom: none; }
th { background: var(--sidebar); font-weight: 500; font-size: 19px; color: var(--muted); }
td:first-child { font-weight: 700; white-space: nowrap; }

/* 訓練循環 */
.loopbox { margin-top: 26px; }
.lrow { display: flex; align-items: stretch; gap: 8px; }
.lstep { flex: 1; padding: 20px 16px; border-radius: 20px; background: var(--rose-tint); border: 1px solid var(--rose-soft);
  font-size: 21px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px; }
.lstep b { font-family: var(--font-en); color: var(--rose); font-size: 26px; }
.larrow { align-self: center; color: var(--rose); font-size: 26px; }
.lback { margin-top: 18px; padding: 14px; text-align: center; border: 1.5px dashed var(--rose); border-radius: 18px; color: var(--rose); font-size: 21px; font-weight: 500; }

/* 誤會 */
.myths { display: grid; gap: 12px; }
.myth { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; }
.myth div { padding: 14px 22px; border-radius: 16px; font-size: 22px; line-height: 1.45; }
.myth .no { background: var(--bg); color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rose); }
.myth .yes { background: var(--sage-soft); font-weight: 500; }

/* 講者備註 */
.notes { display: none; }
.show-notes .slide.active .notes { display: block; position: fixed; left: 50%; bottom: -150px; transform: translateX(-50%);
  width: 1160px; padding: 14px 22px; border-radius: 16px; background: var(--text); color: var(--bg); font-size: 18px; line-height: 1.6; }
.notes b { display: block; font-size: 13px; letter-spacing: .2em; opacity: .7; margin-bottom: 4px; }

/* 控制列 */
.ctrl { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 6px; z-index: 5; }
.ctrl button { font: inherit; font-size: 15px; min-width: 40px; height: 40px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
.ctrl button:hover { border-color: var(--rose); color: var(--rose); }
.progress { position: fixed; left: 0; top: 0; height: 4px; background: var(--rose); transition: width .25s; z-index: 5; }

/* ---------- 手機：改成一張張往下捲 ---------- */
@media (max-width: 760px) {
  body { overflow: auto; }
  .deck { position: static; width: auto; height: auto; transform: none; padding: 16px; display: grid; gap: 16px; }
  .slide { position: relative; opacity: 1; visibility: visible; }
  .frame { position: relative; padding: 24px 20px 16px; border-radius: 22px; }
  .body { overflow: visible; }
  .eyebrow { font-size: 12px; }
  h2 { font-size: 26px; }
  .lead { font-size: 17px; margin-bottom: 14px; }
  .cover h1 { font-size: 36px; } .subtitle { font-size: 19px; margin: 14px 0 20px; } .kicker { font-size: 12px; } .hint { display: none; }
  .road { grid-template-columns: 1fr 1fr; gap: 10px; } .stop { padding: 14px; } .stop span { font-size: 18px; } .stop small { font-size: 13px; }
  .pair { grid-template-columns: 1fr 28px 1fr; } .pair .life, .pair .ai { font-size: 15px; padding: 10px 12px; border-radius: 12px; }
  .pair.head div { padding: 0 12px; font-size: 11px; } .arrow { font-size: 18px; }
  .ring { padding: 10px 12px 12px; border-radius: 18px; } .ring-label { flex-direction: column; gap: 2px; } .ring-label b { font-size: 17px; } .ring-label small { font-size: 13px; }
  .question { font-size: 19px; } .opt { font-size: 16px; padding: 12px 14px; } .explain { font-size: 15px; }
  .calc, .blist.with-fig { grid-template-columns: 1fr; gap: 14px; }
  .steps li { font-size: 15px; padding-left: 34px; } .steps li::before { width: 24px; height: 24px; font-size: 13px; }
  code { white-space: normal; }
  .takeaway { font-size: 15px; }
  .blist li, .with-fig li { font-size: 16px; }
  table { font-size: 14px; } th, td { padding: 10px 10px; } th { font-size: 12px; } td:first-child { white-space: normal; }
  .lrow { flex-direction: column; } .larrow { transform: rotate(90deg); } .lstep { font-size: 15px; flex-direction: row; align-items: baseline; padding: 12px 14px; } .lstep b { font-size: 18px; } .lback { font-size: 15px; }
  .myth { grid-template-columns: 1fr; gap: 4px; } .myth div { font-size: 15px; padding: 10px 14px; }
  footer { flex-wrap: wrap; font-size: 12px; }
  .ctrl, .progress { display: none; }
  .show-notes .slide .notes { display: block; position: static; transform: none; width: auto; margin-top: 8px; font-size: 14px; padding: 12px 14px; border-radius: 14px; background: var(--sidebar); color: var(--text); }
}
@media print {
  body { overflow: visible; } .ctrl, .progress { display: none; }
  .deck { position: static; transform: none; } .slide { position: relative; opacity: 1; visibility: visible; width: 1280px; height: 720px; page-break-after: always; }
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<main class="deck" id="deck">
{{SLIDES}}
</main>
<nav class="ctrl" aria-label="簡報控制">
  <button id="prev" aria-label="上一張">←</button>
  <button id="next" aria-label="下一張">→</button>
  <button id="notesBtn" aria-label="講者備註">備註</button>
  <button id="themeBtn" aria-label="切換深淺色">◐</button>
</nav>
<script>
(() => {
  const slides = [...document.querySelectorAll(".slide")];
  const deck = document.getElementById("deck");
  let cur = 0;
  const clamp = (i) => Math.max(0, Math.min(slides.length - 1, i));
  function fit() {
    const s = Math.min(innerWidth / 1340, innerHeight / (document.body.classList.contains("show-notes") ? 930 : 770));
    deck.style.setProperty("--scale", s.toFixed(4));
  }
  function go(i, push = true) {
    cur = clamp(i);
    slides.forEach((s, k) => s.classList.toggle("active", k === cur));
    document.getElementById("progress").style.width = ((cur + 1) / slides.length * 100) + "%";
    if (push) history.replaceState(null, "", "#" + (cur + 1));
  }
  const mobile = () => matchMedia("(max-width: 760px)").matches;
  addEventListener("keydown", (ev) => {
    if (mobile() || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { go(cur + 1); ev.preventDefault(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { go(cur - 1); ev.preventDefault(); }
    else if (k === "Home") go(0); else if (k === "End") go(slides.length - 1);
    else if (k === "n" || k === "N") toggleNotes(); else if (k === "t" || k === "T") toggleTheme();
  });
  let x0 = null;
  addEventListener("touchstart", (ev) => { x0 = ev.touches[0].clientX; }, { passive: true });
  addEventListener("touchend", (ev) => {
    if (x0 === null || mobile()) return; const dx = ev.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); x0 = null;
  });
  document.getElementById("prev").onclick = () => go(cur - 1);
  document.getElementById("next").onclick = () => go(cur + 1);
  function toggleNotes() { document.body.classList.toggle("show-notes"); fit(); }
  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("deck-theme", r.dataset.theme); } catch (_) {}
  }
  try { const t = localStorage.getItem("deck-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  document.getElementById("notesBtn").onclick = toggleNotes;
  document.getElementById("themeBtn").onclick = toggleTheme;
  document.querySelectorAll(".layout-quiz").forEach((q) => {
    q.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
      q.querySelectorAll(".opt").forEach((o) => o.classList.add(o.dataset.ok === "1" ? "right" : "wrong"));
      q.querySelector(".body").classList.add("answered");
    }));
  });
  addEventListener("resize", fit);
  addEventListener("hashchange", () => go(parseInt(location.hash.slice(1) || "1", 10) - 1, false));
  fit(); go(parseInt(location.hash.slice(1) || "1", 10) - 1, false);

  // 節點 F（版面檢查）用：回傳內容超出版面的投影片
  window.__checkLayout = () => slides.map((s, k) => {
    const b = s.querySelector(".body"), f = s.querySelector(".frame");
    const over = b.scrollHeight - b.clientHeight;
    const wide = [...s.querySelectorAll(".body *")].some((el) => el.getBoundingClientRect().right > f.getBoundingClientRect().right + 1);
    return { n: k + 1, id: s.dataset.id, overflowY: over, overflowX: wide };
  }).filter((r) => r.overflowY > 1 || r.overflowX);
})();
</script>
</body>
</html>
