<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一個神經元的計算過程">
  <defs><marker id="h-nn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker></defs>
  <circle cx="80" cy="80" r="32" class="d-gray"/>
  <text x="80" y="80" text-anchor="middle" dominant-baseline="central">x₁ = 2</text>
  <circle cx="80" cy="200" r="32" class="d-gray"/>
  <text x="80" y="200" text-anchor="middle" dominant-baseline="central">x₂ = 3</text>
  <circle cx="80" cy="290" r="26" class="d-butter"/>
  <text x="80" y="290" text-anchor="middle" dominant-baseline="central">b = 1</text>
  <line x1="112" y1="88" x2="228" y2="135" class="d-line" marker-end="url(#h-nn)"/>
  <text x="160" y="92" class="d-sub">權重 0.5</text>
  <line x1="112" y1="195" x2="228" y2="175" class="d-line" marker-end="url(#h-nn)"/>
  <text x="140" y="224" class="d-sub">權重 −1</text>
  <line x1="106" y1="282" x2="228" y2="205" class="d-line" marker-end="url(#h-nn)"/>
  <text x="150" y="290" class="d-sub">偏差 +1</text>
  <rect x="230" y="105" width="190" height="110" rx="16" class="d-sage"/>
  <text x="325" y="132" text-anchor="middle" class="d-b">① 加權加總 + 偏差</text>
  <text x="325" y="162" text-anchor="middle">0.5×2 + (−1)×3 + 1</text>
  <text x="325" y="190" text-anchor="middle" class="d-b d-t-rose">= 1 − 3 + 1 = −1</text>
  <line x1="420" y1="160" x2="448" y2="160" class="d-line" marker-end="url(#h-nn)"/>
  <rect x="450" y="125" width="120" height="70" rx="16" class="d-rose"/>
  <text x="510" y="149" text-anchor="middle" class="d-b">② ReLU</text>
  <text x="510" y="175" text-anchor="middle" class="d-sub">max(0, −1) = 0</text>
  <line x1="570" y1="160" x2="599" y2="160" class="d-line" marker-end="url(#h-nn)"/>
  <circle cx="625" cy="160" r="24" class="d-rose"/>
  <text x="625" y="160" text-anchor="middle" dominant-baseline="central" class="d-b">0</text>
  <text x="625" y="204" text-anchor="middle" class="d-sub">輸出</text>
</svg>
