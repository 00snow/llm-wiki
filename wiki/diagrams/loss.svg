<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MAE 與 MSE 的比較">
  <text x="40" y="40" class="d-b">三筆資料的誤差：1、0、−2</text>
  <text x="40" y="100" dominant-baseline="central">絕對值（L1）</text>
  <rect x="200" y="80" width="50" height="40" rx="6" class="d-sage"/>
  <text x="225" y="100" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="250" y="80" width="100" height="40" rx="6" class="d-sage"/>
  <text x="300" y="100" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="370" y="100" dominant-baseline="central" class="d-t-sage d-b">MAE = 3 ÷ 3 = 1</text>
  <text x="40" y="180" dominant-baseline="central">平方（L2）</text>
  <rect x="200" y="160" width="50" height="40" rx="6" class="d-rose"/>
  <text x="225" y="180" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="250" y="160" width="200" height="40" rx="6" class="d-rose"/>
  <text x="350" y="180" text-anchor="middle" dominant-baseline="central" class="d-b">4</text>
  <text x="470" y="180" dominant-baseline="central" class="d-t-rose d-b">MSE = 5 ÷ 3 ≈ 1.67</text>
  <text x="40" y="236" class="d-sub">長條長度 = 誤差大小。第 2 筆誤差是 0，所以沒有長度；誤差 −2 平方後變成 4，被放大了。</text>
</svg>
