  <line x1="180" y1="213.6" x2="211" y2="240.4" class="d-line-sage" marker-end="url(#h-gd-s)"/>
  <line x1="216" y1="244.7" x2="240" y2="261.2" class="d-line-sage" marker-end="url(#h-gd-s)"/>
